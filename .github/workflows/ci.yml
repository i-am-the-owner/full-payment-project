name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: almapay
          POSTGRES_DB: almapay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:almapay@localhost:5432/almapay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:unit
      # Integration tests use the real database above and the mock provider only.
      - run: npm run test:integration
      # Fails the build below the coverage thresholds set in package.json.
      - run: npm run test:coverage
      # Browser tests of the admin console (desktop and 375px) against the real API and database.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run scan-secrets

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # The customer app is the Flutter app. These widget tests are the end-to-end UI
  # tests: the whole send flow against a fake backend on a 375px phone and a
  # 1280px desktop window, plus the dynamic recipient forms (EUR, USD, INR, MXN).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  # The full local stack must come up on the mock provider with seed data.
  stack:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
        env:
          API_PORT: "3000"
      - run: sh backend/scripts/uptime-check.sh http://localhost:3000
      - run: docker compose logs seed
        if: always()
      - run: docker compose down -v
        if: always()
