# Static analysis configuration for the AlmaPay mobile app.
# Base ruleset: flutter_lints (the Flutter team's recommended set).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing awaits and dead code as errors in a financial app.
    unawaited_futures: error
    dead_code: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    directives_ordering: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    require_trailing_commas: true
    unawaited_futures: true
    use_super_parameters: true
    # Conflicts with private-field dependency injection via named parameters
    # (Dart forbids `this._field` as a named parameter name).
    prefer_initializing_formals: false
